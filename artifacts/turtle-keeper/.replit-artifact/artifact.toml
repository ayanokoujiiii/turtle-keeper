kind = "mobile"
previewPath = "/"
title = "Turtle Keeper"
description = "An offline-first personal Android app for managing turtles, daily care, reminders, logs, growth history, notes, photos, statistics, and portable backup data."
version = "1.0.0"
id = "artifacts/turtle-keeper"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23419

[services.development]
run = "pnpm --filter @workspace/turtle-keeper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/turtle-keeper", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/turtle-keeper", "run", "serve" ]

[services.env]
PORT = "23419"
BASE_PATH = "/"
